<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="RTX 2080 Ti 22G 单卡长上下文工场：KVMem 主线 262K 上下文 36.6 tok/s，KV 流式备档">
  <title>RTX 2080 Ti 22G 单卡长上下文工场：KVMem 主线 262K 上下文 36.6 tok/s，KV 流式无损备档</title>
  <defs>
    <linearGradient id="gpuGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76B900" stop-opacity=".22"/>
      <stop offset="1" stop-color="#76B900" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="ramGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0A429" stop-opacity=".14"/>
      <stop offset="1" stop-color="#F0A429" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="560" rx="18" fill="#0B0F1A"/>
  <rect x="1.5" y="1.5" width="1197" height="557" rx="16.5" fill="none" stroke="#22304A" stroke-width="1.5"/>

  <!-- faint grid motif -->
  <g stroke="#16223A" stroke-width="1">
    <path d="M0 140h1200M0 420h1200"/>
    <path d="M300 0v560M760 0v560" opacity=".5"/>
  </g>

  <!-- ══ left: title block ══ -->
  <g text-anchor="start" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="64" y="86" font-size="19" fill="#76B900" letter-spacing="3">RTX 2080 Ti · TURING sm_75 · 22 GB</text>

    <text x="60" y="170" font-size="54" font-weight="700" fill="#E8EEF7">单卡 22G，26 万上下文</text>
    <text x="64" y="216" font-size="25" fill="#93A1B5">KVMem 主线 <tspan fill="#E8EEF7">＋</tspan> KV 流式备档 <tspan fill="#E8EEF7">·</tspan> 两条路线全部实测跑通</text>

    <!-- stat chips -->
    <g font-family="'Segoe UI','Consolas','PingFang SC','Microsoft YaHei',sans-serif">
      <rect x="62" y="258" width="228" height="96" rx="12" fill="#101A2C" stroke="#2A3B5C"/>
      <text x="86" y="302" font-size="34" font-weight="700" fill="#76B900">262,144</text>
      <text x="86" y="332" font-size="18" fill="#93A1B5">tokens 上下文（-c）</text>

      <rect x="310" y="258" width="228" height="96" rx="12" fill="#101A2C" stroke="#2A3B5C"/>
      <text x="334" y="302" font-size="34" font-weight="700" fill="#76B900">36.6</text>
      <text x="404" y="302" font-size="20" fill="#76B900">tok/s</text>
      <text x="334" y="332" font-size="18" fill="#93A1B5">decode · IQ3_S+MTP</text>

      <rect x="558" y="258" width="228" height="96" rx="12" fill="#101A2C" stroke="#2A3B5C"/>
      <text x="582" y="302" font-size="34" font-weight="700" fill="#76B900">3–4×</text>
      <text x="582" y="332" font-size="18" fill="#93A1B5">快过流式（&gt;135K）</text>
    </g>

    <!-- sub line: vision + mtp -->
    <g font-size="19" fill="#93A1B5">
      <text x="64" y="398"><tspan fill="#76B900">✔</tspan> 视觉 mmproj 上 GPU　<tspan fill="#76B900">✔</tspan> MTP 接受率 58.6%　<tspan fill="#76B900">✔</tspan> 显存余 6 GB</text>
      <text x="64" y="432"><tspan fill="#F0A429">◆</tspan> KV 流式备档：260,096 token needle 精确命中（无损全量注意力）</text>
    </g>

    <!-- claim -->
    <rect x="60" y="462" width="726" height="54" rx="10" fill="#0E1830" stroke="#76B900" stroke-opacity=".35"/>
    <text x="82" y="496" font-size="20" fill="#E8EEF7">2080 Ti 22G 单卡本地部署的<tspan fill="#76B900" font-weight="700">性能 / 性价比最优长上下文方案</tspan>，附完整复现链</text>
  </g>

  <!-- ══ right: memory-tier diagram (project motif) ══ -->
  <g font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
    <!-- GPU card -->
    <rect x="850" y="72" width="290" height="176" rx="14" fill="url(#gpuGlow)" stroke="#76B900" stroke-width="1.5"/>
    <text x="872" y="106" font-size="20" font-weight="700" fill="#76B900">GPU · 22 GB</text>
    <text x="872" y="132" font-size="17" fill="#93A1B5">有界 KV 工作集 52K</text>

    <!-- retrieval window cells -->
    <g>
      <rect x="872" y="150" width="76" height="44" rx="6" fill="#76B900" opacity=".85"/>
      <rect x="958" y="150" width="76" height="44" rx="6" fill="#76B900" opacity=".55"/>
      <rect x="1044" y="150" width="76" height="44" rx="6" fill="#76B900" opacity=".30"/>
      <text x="884" y="212" font-size="16" fill="#93A1B5">检索命中</text>
      <text x="972" y="212" font-size="16" fill="#93A1B5">生成预留</text>
    </g>

    <!-- pcie arrow -->
    <g stroke="#5B7FBF" stroke-width="2" fill="none">
      <path d="M995 248v44M987 284l8 10 8-10" />
      <path d="M965 316v-44M957 280l8-10 8 10" />
    </g>
    <text x="1012" y="286" font-size="16" fill="#5B7FBF">PCIe 检索 / 回写</text>

    <!-- RAM stack -->
    <rect x="850" y="330" width="290" height="182" rx="14" fill="url(#ramGlow)" stroke="#F0A429" stroke-width="1.5"/>
    <text x="872" y="364" font-size="20" font-weight="700" fill="#F0A429">主机内存 · KV 块仓库</text>
    <g>
      <rect x="872" y="384" width="112" height="34" rx="6" fill="#F0A429" opacity=".18" stroke="#F0A429" stroke-opacity=".5"/>
      <rect x="996" y="384" width="112" height="34" rx="6" fill="#F0A429" opacity=".12" stroke="#F0A429" stroke-opacity=".4"/>
      <rect x="872" y="430" width="112" height="34" rx="6" fill="#F0A429" opacity=".12" stroke="#F0A429" stroke-opacity=".4"/>
      <rect x="996" y="430" width="112" height="34" rx="6" fill="#F0A429" opacity=".18" stroke="#F0A429" stroke-opacity=".5"/>
      <rect x="872" y="476" width="112" height="24" rx="6" fill="#F0A429" opacity=".08" stroke="#F0A429" stroke-opacity=".3"/>
      <rect x="996" y="476" width="112" height="24" rx="6" fill="#F0A429" opacity=".08" stroke="#F0A429" stroke-opacity=".3"/>
    </g>
    <text x="872" y="470" font-size="15" fill="#93A1B5" opacity=".85">q8_0 量化 · 128-token 块 · 按 query 检索</text>
  </g>
</svg>
